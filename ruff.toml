# Linting and formatting configuration.
# Check:  ruff check .
# Fix:    ruff check . --fix
# Format: ruff format .

line-length = 100
target-version = "py312"

# .github holds the course's own checker, not your code. It is excluded so that
# a change I make there can never turn your CI red.
exclude = [".venv", "__pycache__", "faiss_index", "chroma_db", ".github"]

[lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes — undefined names, unused imports
    "I",    # import sorting
    "UP",   # prefer modern Python syntax
    "B",    # common bug patterns
]
ignore = ["E501"]   # long lines are handled by the formatter
